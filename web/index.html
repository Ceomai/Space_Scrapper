<meta charset="utf-8">
<title>Space Scrapper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;700&family=VT323&display=swap">
<style>
/* PELIKAN-OS: gemi bilgisayarı konsolu. Üstte durum konsolu, ortada kaydırılan ekran, altta 3'lü dok. Paneller köşe braketli, düğmeler pahlı.
   Renk teması (Lavanta / Gece / Pas) × stil (vektör / piksel). */
[hidden]{display:none!important}
:root{
  --bg:#ecebf5; --surface:#fbfaff; --surface2:#f1effa; --ink:#1c1838; --muted:#5d5784; --line:#d3cfe8; --line2:#a9a2d1;
  --accent:#d92e6a; --accent2:#1594b3; --good:#14834f; --bad:#cc2a43; --warn:#c96f00; --btn-ink:#ffffff; --grid:rgba(28,24,56,.05);
  --en:#e6a100; --hu:#e5642a; --he:#d92e4f; --mo:#1d8fe0; --scrim:rgba(12,8,30,.55);
  --display:"Chakra Petch","Segoe UI",sans-serif; --body:"Chakra Petch","Segoe UI",system-ui,sans-serif; --mono:"Chakra Petch","Segoe UI",sans-serif;
  --cut:9px; --shadow:0 1px 0 var(--line), 0 8px 22px rgba(40,30,90,.08);
  color-scheme:light;
}
:root[data-theme="gece"]{
  --bg:#0c0a1d; --surface:#15122d; --surface2:#1d1a3e; --ink:#ece8ff; --muted:#a39cd2; --line:#2a2556; --line2:#433c80;
  --accent:#ff5c97; --accent2:#45d1ee; --good:#3fd68c; --bad:#ff5b70; --warn:#ffb347; --btn-ink:#0c0a1d; --grid:rgba(255,255,255,.035);
  --en:#ffcf3f; --hu:#ff9a55; --he:#ff5a73; --mo:#4fb8ff; --scrim:rgba(3,2,12,.72); --shadow:0 10px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
:root[data-theme="pas"]{
  --bg:#100f0c; --surface:#19170f; --surface2:#221f17; --ink:#e8dec2; --muted:#a09676; --line:#35312a; --line2:#51493a;
  --accent:#e0a43a; --accent2:#7fc9b8; --good:#9cc15a; --bad:#d8503e; --warn:#e08a2b; --btn-ink:#120f08; --grid:rgba(224,164,58,.045);
  --en:#d8ae45; --hu:#c47a3f; --he:#c2412f; --mo:#6f9c8f; --scrim:rgba(0,0,0,.75); --shadow:0 10px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-style="pixel"]{ --display:"Pixelify Sans","Courier New",monospace; --body:"VT323","Courier New",monospace; --mono:"VT323","Courier New",monospace; --cut:6px }

html{box-sizing:border-box;height:100%;overflow:hidden}
body{height:100%;overflow:hidden}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
:root[data-style="pixel"] body{font-size:20px;line-height:1.25}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:23px;letter-spacing:.01em} h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em}
:root[data-style="pixel"] h2{font-size:26px} :root[data-style="pixel"] h3{font-size:19px;letter-spacing:.02em}
p{margin:0} b{font-weight:700}
small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
:root[data-style="pixel"] small{font-size:17px;line-height:1.2} :root[data-style="pixel"] b{font-weight:400}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
:root[data-style="pixel"] .eyebrow{font-size:16px;letter-spacing:.06em}
.pcode{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:2px 6px;background:var(--ink);color:var(--bg);white-space:nowrap;flex:none}
:root[data-style="pixel"] .pcode{font-size:15px}
.label{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:4px}
:root[data-style="pixel"] .label{font-size:16px;letter-spacing:.04em}
canvas.ico{display:block;flex:none}
.neg,.neg b,.neg span{color:var(--bad)!important}
.good-t{color:var(--good)}

/* ---------- üst konsol ---------- */
.hud{background:var(--surface);border-bottom:1px solid var(--line2);padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;position:relative}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,transparent 8px 16px);opacity:.55}
.hud-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center}
.hud-loc{display:flex;flex-direction:column;gap:3px;min-width:0}
.hud-loc .pcode{align-self:flex-start}
.hud-loc b{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-clock{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line2);padding:3px 8px;background:var(--surface2)}
.hud-clock b{font-family:var(--mono);font-size:24px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.hud-clock span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hud-clock.late b{color:var(--bad)}
.hud-cash{display:flex;flex-direction:column;align-items:flex-end}
.hud-cash b{font-family:var(--mono);font-size:20px;color:var(--good);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-cash span{font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
:root[data-style="pixel"] .hud-clock b{font-size:30px} :root[data-style="pixel"] .hud-clock span,:root[data-style="pixel"] .hud-cash span{font-size:15px} :root[data-style="pixel"] .hud-cash b{font-size:26px} :root[data-style="pixel"] .hud-loc b{font-size:18px}
.help{width:32px;height:32px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.menu-list{display:flex;flex-direction:column;gap:7px}
.coach{display:flex;gap:8px;align-items:center;padding:7px max(12px,env(safe-area-inset-right,0px)) 7px max(12px,env(safe-area-inset-left,0px));background:var(--surface2);border-bottom:1px solid var(--accent);font-size:13.5px;flex-shrink:0}
.coach p{flex:1;min-width:0;line-height:1.35}
.coach b{color:var(--accent);margin-right:4px}
.coach-x{flex:none;background:none;border:1px solid var(--line2);color:var(--muted);font:inherit;font-size:12px;padding:4px 8px;cursor:pointer}
:root[data-style="pixel"] .coach{font-size:17px}
.node::before{content:'';position:absolute;left:50%;bottom:100%;width:76px;height:58px;transform:translateX(-50%)}
.map-area.compact .node::before{width:64px;height:46px}
.node.aim{border-color:var(--accent);animation:pulse 1.8s infinite;box-shadow:0 0 0 2px var(--accent)}
.paints{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.paint{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:8px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);cursor:pointer;text-align:left}
.paint i{width:100%;height:14px;border:1px solid var(--line2)}
.paint span{font-weight:600;font-size:13px}
.paint.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.paint:disabled{opacity:.5;cursor:not-allowed}
.help:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.gauge{display:grid;grid-template-columns:52px 1fr 28px;gap:6px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gauge b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;font-weight:400}
.gauge.low span,.gauge.low b{color:var(--bad)}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:9px}
.segs i{background:var(--line);transform:skewX(-14deg)}
.segs.en i.on{background:var(--en)} .segs.hu i.on{background:var(--hu)} .segs.he i.on{background:var(--he)} .segs.mo i.on{background:var(--mo)}
:root[data-style="pixel"] .gauge{font-size:16px;grid-template-columns:64px 1fr 32px} :root[data-style="pixel"] .segs i{transform:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.chips span{border:1px solid var(--line);padding:1px 7px;background:var(--surface2)}
.chips b{color:var(--ink);font-weight:400}
:root[data-style="pixel"] .chips{font-size:16px}

/* ---------- ana alan ---------- */
main{flex:1;overflow-y:auto;padding-block:16px 24px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
main>*{flex-shrink:0}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}
.ph{display:flex;align-items:center;gap:8px;min-width:0;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.ph h3{flex:1;min-width:0}
.paside{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
:root[data-style="pixel"] .paside{font-size:16px}
.panel.is-bad{border-color:var(--bad)} .panel.is-good{border-color:var(--good)}
.panel.decision{border:1px solid var(--accent);background:linear-gradient(var(--surface),var(--surface)) padding-box}
.panel.decision .ph{border-bottom-color:var(--accent)}
.panel.vendor{border-style:dashed}
.alert{border:1px solid var(--bad);color:var(--bad);background:var(--surface);padding:9px 12px;font-size:14px;position:relative;padding-left:16px}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:repeating-linear-gradient(-45deg,var(--bad) 0 4px,transparent 4px 8px)}
.alert.info{border-color:var(--accent2);color:var(--ink)} .alert.info::before{background:var(--accent2)}
:root[data-style="pixel"] .alert{font-size:18px}
.empty{color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);min-width:0}
.row-item:last-child{border-bottom:0}
.row-item>div:not(.btns){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-item .meta{color:var(--ink);font-family:var(--mono);font-size:12px}
:root[data-style="pixel"] .row-item .meta{font-size:16px}
.row-item.locked,.row-item.sold,.row-item.gone{opacity:.55}
.row-item.zone.sniff{background:color-mix(in srgb,var(--good) 10%,transparent);padding-inline:8px}
.row-i{display:flex;gap:12px;align-items:flex-start}
.row-i>p,.row-i>div{flex:1;min-width:0}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.kv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.kv li{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px dotted var(--line);padding-bottom:4px}
.kv li:last-child{border-bottom:0}
.kv li span{color:var(--muted);min-width:0}
.kv li b{font-family:var(--mono);font-weight:400;white-space:nowrap}
.kv li.wrapv b{white-space:normal;text-align:right;font-family:var(--body)}
:root[data-style="pixel"] .kv li{font-size:18px}
.pill{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.pill.good{color:var(--good);border-color:var(--good)} .pill.bad{color:var(--bad);border-color:var(--bad)}
:root[data-style="pixel"] .pill{font-size:15px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11.5px;padding:2px 7px;background:var(--surface2);border:1px solid var(--line2);text-transform:uppercase;letter-spacing:.04em}
:root[data-style="pixel"] .tag{font-size:15px}
.st{align-self:flex-start;font-style:normal;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border:1px solid currentColor;display:inline-block;margin-top:3px}
.st.good{color:var(--good)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
:root[data-style="pixel"] .st{font-size:15px}
.track{height:7px;background:var(--surface2);border:1px solid var(--line);position:relative;overflow:visible}
.track i{display:block;height:100%;background:var(--accent2)}
.track.win i{background:var(--good)}
.track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}

/* ---------- düğmeler ---------- */
.btn{font-family:var(--display);font-weight:700;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;border:0;padding:10px 14px;cursor:pointer;background:var(--accent2);color:var(--btn-ink);min-height:40px;white-space:nowrap;touch-action:manipulation;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:filter .15s,transform .06s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.primary{background:var(--accent)} .btn.good{background:var(--good)} .btn.danger{background:var(--bad)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.danger-t{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.btn.sm{font-size:12.5px;padding:7px 11px;min-height:34px}
.btn.q{min-height:28px;padding:3px 10px}
.btn.block{width:100%;padding:14px;font-size:15px}
.btn:disabled{background:var(--surface2)!important;color:var(--muted)!important;box-shadow:inset 0 0 0 1px var(--line)!important;cursor:not-allowed;filter:none}
:root[data-style="pixel"] .btn{font-family:var(--body);font-size:20px;font-weight:400;letter-spacing:.02em;text-transform:none}
:root[data-style="pixel"] .btn.sm{font-size:18px} :root[data-style="pixel"] .btn.block{font-size:22px}

/* ---------- dok ---------- */
.dock{display:grid;grid-template-columns:1fr 1.35fr 1fr .95fr;gap:6px;background:var(--surface);border-top:1px solid var(--line2);padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.dock button{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:1px solid transparent;color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 4px;cursor:pointer;min-width:0}
.dock button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dock .dk-ico{font-size:17px;line-height:1}
.dock button.on{color:var(--ink);border-color:var(--line2);background:var(--surface2)}
.dock button.here{border-color:var(--accent)}
.dock button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
:root[data-style="pixel"] .dock button{font-size:15px}

/* ---------- harita ---------- */
.map-wrap{position:relative;width:100%;border:1px solid var(--line2);background:var(--surface);overflow:hidden;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.map-area{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--space,#000)}
main.v-map{padding:0;gap:0;overflow:hidden}
main.v-map>.map-wrap{border:0}
.map-area canvas{position:absolute;inset:0;width:100%;height:100%}
.map-top{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:6px 8px;background:var(--surface);border-bottom:1px solid var(--line2)}
.mm{background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line2);padding:4px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;backdrop-filter:blur(3px)}
.mm small{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm b{font-family:var(--mono);font-weight:400;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .track{height:4px} .mm.win .track i{background:var(--good)}
:root[data-style="pixel"] .mm small{font-size:14px} :root[data-style="pixel"] .mm b{font-size:15px}
.map-alert{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:2;background:var(--bad);color:var(--btn-ink);font-family:var(--mono);font-size:12px;padding:3px 10px;white-space:nowrap}
.bubble{position:absolute;left:8px;right:8px;bottom:62px;z-index:3;display:flex;gap:8px;align-items:center;text-align:left;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--accent2);padding:6px 8px;color:var(--ink);font:inherit;font-size:13.5px;font-style:italic;cursor:pointer}
.bubble span{flex:1;min-width:0}
.bubble i{font-style:normal;font-size:18px;color:var(--muted);padding:0 4px}
:root[data-style="pixel"] .bubble{font-size:17px;font-style:normal}
.map-bottom{flex:0 0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;padding:6px 8px;background:var(--surface);border-top:1px solid var(--line2)}
.qb{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line2);color:var(--ink);padding:8px 4px;cursor:pointer;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.qb b{font-weight:400;font-size:14px;color:var(--accent2)}
.qb.hot{background:var(--accent);color:var(--btn-ink);border-color:var(--accent);animation:pulse 1.6s infinite}
.qb.hot b{color:var(--btn-ink)} .qb.warn b{color:var(--warn)}
.qb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:root[data-style="pixel"] .qb{font-size:15px} :root[data-style="pixel"] .qb b{font-size:18px}
@keyframes pulse{50%{filter:brightness(1.25)}}
.node{position:absolute;z-index:1;transform:translate(-50%,26px);display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line2);padding:2px 7px 3px;cursor:pointer;color:var(--ink);font-family:var(--body);backdrop-filter:blur(2px);
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.node .n-name{font-family:var(--display);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.node .n-cost{font-family:var(--mono);font-size:10px;color:var(--accent2);white-space:nowrap}
.node.here{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .node.here .n-cost{color:var(--accent)}
.node.closed{opacity:.7} .node.closed .n-cost{color:var(--bad)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:root[data-style="pixel"] .node .n-name{font-size:12px;letter-spacing:0} :root[data-style="pixel"] .node .n-cost{font-size:12px}
@media (max-width:400px){.node{padding:2px 5px}.node .n-name{font-size:10px}}
/* alt sekmeler */
.subtabs{display:flex;gap:4px;overflow-x:auto;flex-shrink:0}
.subtabs button{flex:1 0 auto;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;background:var(--surface);color:var(--muted);border:1px solid var(--line2);cursor:pointer;white-space:nowrap}

<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>Space Scrapper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Borçlu bir hurdacının uzay istasyonundaki hayatı. Kancayla hurda avla, iş kovala, haneni doyur, gemini büyüt.">
<meta name="theme-color" content="#0c0a1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Space Scrapper">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;700&family=VT323&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
/* PELIKAN-OS: gemi bilgisayarı konsolu. Üstte durum konsolu, ortada kaydırılan ekran, altta 3'lü dok. Paneller köşe braketli, düğmeler pahlı.
   Renk teması (Lavanta / Gece / Pas) × stil (vektör / piksel). */
[hidden]{display:none!important}
/* renk, yazı, boşluk ve köşe belirteçleri: theme.css */

html{box-sizing:border-box;height:100%;overflow:hidden}
body{height:100%;overflow:hidden}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--tx-base);line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
:root[data-style="pixel"] body{line-height:1.25}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:var(--fs-23);letter-spacing:.01em} h3{font-size:var(--tx-h3);text-transform:uppercase;letter-spacing:.06em}
:root[data-style="pixel"] h2{font-size:var(--tx-xl)} :root[data-style="pixel"] h3{font-size:var(--tx-h3);letter-spacing:.02em}
p{margin:0} b{font-weight:700}
small{display:block;color:var(--muted);font-size:var(--tx-sm);line-height:1.35}
:root[data-style="pixel"] small{font-size:var(--tx-sm);line-height:1.2} :root[data-style="pixel"] b{font-weight:400}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:var(--tx-xs);text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
:root[data-style="pixel"] .eyebrow{letter-spacing:.06em}
.pcode{font-family:var(--mono);font-size:var(--tx-2xs);letter-spacing:.08em;padding:var(--sp-0-5) var(--sp-1-5);background:var(--ink);color:var(--bg);white-space:nowrap;flex:none}
.label{font-family:var(--mono);font-size:var(--tx-label);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:4px}
:root[data-style="pixel"] .label{letter-spacing:.04em}
canvas.ico{display:block;flex:none}
.neg,.neg b,.neg span{color:var(--bad)!important}
.good-t{color:var(--good)}

/* ---------- üst konsol ---------- */
.hud{background:var(--surface);border-bottom:1px solid var(--line2);padding:var(--sp-2-5) max(var(--sp-3-5),env(safe-area-inset-right,0px)) var(--sp-2-5) max(var(--sp-3-5),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--sp-2);position:relative}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,transparent 8px 16px);opacity:.55}
.hud-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:var(--sp-2-5);align-items:center}
.hud-loc{display:flex;flex-direction:column;gap:3px;min-width:0}
.hud-loc .pcode{align-self:flex-start}
.hud-loc b{font-family:var(--display);font-size:var(--fs-base);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-clock{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line2);padding:3px var(--sp-2);background:var(--surface2)}
.hud-clock b{font-family:var(--mono);font-size:var(--tx-2xl);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.hud-clock span{font-family:var(--mono);font-size:var(--tx-2xs);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hud-clock.late b{color:var(--bad)}
.hud-cash{display:flex;flex-direction:column;align-items:flex-end}
.hud-cash b{font-family:var(--mono);font-size:var(--tx-xl);color:var(--good);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-cash span{font-size:var(--tx-2xs);color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
:root[data-style="pixel"] .hud-loc b{font-size:var(--tx-md)}
.help{width:32px;height:32px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font-family:var(--display);font-weight:700;font-size:var(--fs-16);cursor:pointer;clip-path:polygon(var(--cut-sm) 0,100% 0,100% calc(100% - var(--cut-sm)),calc(100% - var(--cut-sm)) 100%,0 100%,0 var(--cut-sm))}
.menu-list{display:flex;flex-direction:column;gap:7px}
.coach{display:flex;gap:var(--sp-2);align-items:center;padding:7px max(var(--sp-3),env(safe-area-inset-right,0px)) 7px max(var(--sp-3),env(safe-area-inset-left,0px));background:var(--surface2);border-bottom:1px solid var(--accent);font-size:var(--tx-note);flex-shrink:0}
.coach p{flex:1;min-width:0;line-height:1.35}
.coach b{color:var(--accent);margin-right:4px}
.coach-x{flex:none;background:none;border:1px solid var(--line2);color:var(--muted);font:inherit;font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-2);cursor:pointer}
.node::before{content:'';position:absolute;left:50%;bottom:100%;width:76px;height:58px;transform:translateX(-50%)}
.map-area.compact .node::before{width:64px;height:46px}
.node.aim{border-color:var(--accent);animation:pulse 1.8s infinite;box-shadow:0 0 0 2px var(--accent)}
.paints{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:var(--sp-1-5)}
.paint{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:var(--sp-2);border:1px solid var(--line2);background:var(--surface2);color:var(--ink);cursor:pointer;text-align:left}
.paint i{width:100%;height:14px;border:1px solid var(--line2)}
.paint span{font-weight:600;font-size:var(--fs-sm)}
.paint.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.paint:disabled{opacity:.5;cursor:not-allowed}
.help:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-1) var(--sp-3-5)}
.gauge{display:grid;grid-template-columns:52px 1fr 28px;gap:var(--sp-1-5);align-items:center;font-family:var(--mono);font-size:var(--tx-label);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gauge b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;font-weight:400}
.gauge.low span,.gauge.low b{color:var(--bad)}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--sp-0-5);height:9px}
.segs i{background:var(--line);transform:skewX(-14deg)}
.segs.en i.on{background:var(--en)} .segs.hu i.on{background:var(--hu)} .segs.he i.on{background:var(--he)} .segs.mo i.on{background:var(--mo)}
:root[data-style="pixel"] .gauge{grid-template-columns:64px 1fr 32px} :root[data-style="pixel"] .segs i{transform:none}
.chips{display:flex;gap:var(--sp-1-5);flex-wrap:wrap;font-family:var(--mono);font-size:var(--tx-xs);color:var(--muted)}
.chips span{border:1px solid var(--line);padding:1px 7px;background:var(--surface2)}
.chips b{color:var(--ink);font-weight:400}

/* ---------- ana alan ---------- */
main{flex:1;overflow-y:auto;padding-block:var(--sp-4) var(--sp-6);padding-left:max(var(--sp-3-5),env(safe-area-inset-left,0px));padding-right:max(var(--sp-3-5),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--sp-3);-webkit-overflow-scrolling:touch}
main>*{flex-shrink:0}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);padding:var(--sp-3-5);display:flex;flex-direction:column;gap:var(--sp-2-5);box-shadow:var(--shadow);min-width:0}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}
.ph{display:flex;align-items:center;gap:var(--sp-2);min-width:0;padding-bottom:var(--sp-2);border-bottom:1px dashed var(--line)}
.ph h3{flex:1;min-width:0}
.paside{font-family:var(--mono);font-size:var(--tx-xs);color:var(--muted);white-space:nowrap}
.panel.is-bad{border-color:var(--bad)} .panel.is-good{border-color:var(--good)}
.panel.decision{border:1px solid var(--accent);background:linear-gradient(var(--surface),var(--surface)) padding-box}
.panel.decision .ph{border-bottom-color:var(--accent)}
.panel.vendor{border-style:dashed}
.alert{border:1px solid var(--bad);color:var(--bad);background:var(--surface);padding:9px var(--sp-3);font-size:var(--tx-md);position:relative;padding-left:var(--sp-4)}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:repeating-linear-gradient(-45deg,var(--bad) 0 4px,transparent 4px 8px)}
.alert.info{border-color:var(--accent2);color:var(--ink)} .alert.info::before{background:var(--accent2)}
.empty{color:var(--muted);font-size:var(--fs-md)}
.list{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;gap:var(--sp-2-5);padding:9px 0;border-bottom:1px dashed var(--line);min-width:0}
.row-item:last-child{border-bottom:0}
.row-item>div:not(.btns){flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-0-5)}
.row-item .meta{color:var(--ink);font-family:var(--mono);font-size:var(--tx-xs)}
:root[data-style="pixel"] .row-item .meta{font-size:var(--tx-xs)} /* <small class="meta">: genel piksel small kuralını ezer */
.row-item.locked,.row-item.sold,.row-item.gone{opacity:.55}
.row-item.zone.sniff{background:color-mix(in srgb,var(--good) 10%,transparent);padding-inline:var(--sp-2)}
.row-i{display:flex;gap:var(--sp-3);align-items:flex-start}
.row-i>p,.row-i>div{flex:1;min-width:0}
.btns{display:flex;gap:var(--sp-1-5);flex-wrap:wrap;justify-content:flex-end;flex:none}
.row{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.kv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.kv li{display:flex;justify-content:space-between;gap:var(--sp-3);font-size:var(--tx-md);border-bottom:1px dotted var(--line);padding-bottom:var(--sp-1)}
.kv li:last-child{border-bottom:0}
.kv li span{color:var(--muted);min-width:0}
.kv li b{font-family:var(--mono);font-weight:400;white-space:nowrap}
.kv li.wrapv b{white-space:normal;text-align:right;font-family:var(--body)}
.pill{font-family:var(--mono);font-size:var(--tx-caps);padding:var(--sp-0-5) var(--sp-2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.pill.good{color:var(--good);border-color:var(--good)} .pill.bad{color:var(--bad);border-color:var(--bad)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:var(--tx-caps);padding:var(--sp-0-5) 7px;background:var(--surface2);border:1px solid var(--line2);text-transform:uppercase;letter-spacing:.04em}
.st{align-self:flex-start;font-style:normal;font-family:var(--mono);font-size:var(--tx-2xs);text-transform:uppercase;letter-spacing:.06em;padding:1px var(--sp-1-5);border:1px solid currentColor;display:inline-block;margin-top:3px}
.st.good{color:var(--good)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
.track{height:7px;background:var(--surface2);border:1px solid var(--line);position:relative;overflow:visible}
.track i{display:block;height:100%;background:var(--accent2)}
.track.win i{background:var(--good)}
.track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}

/* ---------- düğmeler ---------- */
.btn{font-family:var(--display);font-weight:700;font-size:var(--fs-13-5);letter-spacing:.06em;text-transform:uppercase;line-height:1.1;border:0;padding:var(--sp-2-5) var(--sp-3-5);cursor:pointer;background:var(--accent2);color:var(--btn-ink);min-height:40px;white-space:nowrap;touch-action:manipulation;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:filter .15s,transform .06s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.primary{background:var(--accent)} .btn.good{background:var(--good)} .btn.danger{background:var(--bad)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.danger-t{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.btn.sm{font-size:var(--fs-12-5);padding:7px 11px;min-height:34px}
.btn.q{min-height:28px;padding:3px var(--sp-2-5)}
.btn.block{width:100%;padding:var(--sp-3-5);font-size:var(--fs-base)}
.btn:disabled{background:var(--surface2)!important;color:var(--muted)!important;box-shadow:inset 0 0 0 1px var(--line)!important;cursor:not-allowed;filter:none}
:root[data-style="pixel"] .btn{font-family:var(--body);font-size:var(--tx-base);font-weight:400;letter-spacing:.02em;text-transform:none}
:root[data-style="pixel"] .btn.sm{font-size:var(--tx-md)} :root[data-style="pixel"] .btn.block{font-size:var(--fs-22)}

/* ---------- dok ---------- */
.dock{display:grid;grid-template-columns:1fr 1.35fr 1fr .95fr;gap:var(--sp-1-5);background:var(--surface);border-top:1px solid var(--line2);padding:var(--sp-1-5) max(var(--sp-2-5),env(safe-area-inset-right,0px)) var(--sp-1-5) max(var(--sp-2-5),env(safe-area-inset-left,0px))}
.dock button{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:1px solid transparent;color:var(--muted);font-family:var(--mono);font-size:var(--tx-2xs);text-transform:uppercase;letter-spacing:.06em;padding:var(--sp-1-5) var(--sp-1);cursor:pointer;min-width:0}
.dock button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dock .dk-ico{font-size:var(--fs-lg);line-height:1}
.dock button.on{color:var(--ink);border-color:var(--line2);background:var(--surface2)}
.dock button.here{border-color:var(--accent)}
.dock button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- harita ---------- */
.map-wrap{position:relative;width:100%;border:1px solid var(--line2);background:var(--surface);overflow:hidden;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.map-area{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--space)}
main.v-map{padding:0;gap:0;overflow:hidden}
main.v-map>.map-wrap{border:0}
.map-area canvas{position:absolute;inset:0;width:100%;height:100%}
.map-top{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:var(--sp-1-5) var(--sp-2);background:var(--surface);border-bottom:1px solid var(--line2)}
.mm{background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line2);padding:var(--sp-1) var(--sp-1-5);display:flex;flex-direction:column;gap:var(--sp-0-5);min-width:0;backdrop-filter:blur(3px)}
.mm small{font-family:var(--mono);font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm b{font-family:var(--mono);font-weight:400;font-size:var(--tx-caps);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .track{height:4px} .mm.win .track i{background:var(--good)}
:root[data-style="pixel"] .mm small{font-size:var(--fs-md)}
.map-alert{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:2;background:var(--bad);color:var(--btn-ink);font-family:var(--mono);font-size:var(--fs-xs);padding:3px var(--sp-2-5);white-space:nowrap}
.bubble{position:absolute;left:8px;right:8px;bottom:62px;z-index:3;display:flex;gap:var(--sp-2);align-items:center;text-align:left;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--accent2);padding:var(--sp-1-5) var(--sp-2);color:var(--ink);font:inherit;font-size:var(--tx-note);font-style:italic;cursor:pointer}
.bubble span{flex:1;min-width:0}
.bubble i{font-style:normal;font-size:var(--fs-18);color:var(--muted);padding:0 var(--sp-1)}
:root[data-style="pixel"] .bubble{font-style:normal}
.map-bottom{flex:0 0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;padding:var(--sp-1-5) var(--sp-2);background:var(--surface);border-top:1px solid var(--line2)}
.qb{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--sp-1-5);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line2);color:var(--ink);padding:var(--sp-2) var(--sp-1);cursor:pointer;font-family:var(--mono);font-size:var(--tx-caps);text-transform:uppercase;letter-spacing:.05em;
  clip-path:polygon(var(--cut-md) 0,100% 0,100% calc(100% - var(--cut-md)),calc(100% - var(--cut-md)) 100%,0 100%,0 var(--cut-md))}
.qb b{font-weight:400;font-size:var(--tx-md);color:var(--accent2)}
.qb.hot{background:var(--accent);color:var(--btn-ink);border-color:var(--accent);animation:pulse 1.6s infinite}
.qb.hot b{color:var(--btn-ink)} .qb.warn b{color:var(--warn)}
.qb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@keyframes pulse{50%{filter:brightness(1.25)}}
.node{position:absolute;z-index:1;transform:translate(-50%,26px);display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line2);padding:var(--sp-0-5) 7px 3px;cursor:pointer;color:var(--ink);font-family:var(--body);backdrop-filter:blur(2px);
  clip-path:polygon(var(--cut-xs) 0,100% 0,100% calc(100% - var(--cut-xs)),calc(100% - var(--cut-xs)) 100%,0 100%,0 var(--cut-xs))}
.node .n-name{font-family:var(--display);font-weight:700;font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.node .n-cost{font-family:var(--mono);font-size:var(--fs-2xs);color:var(--accent2);white-space:nowrap}
/* kenara yakın düğümlerin etiketi içeri kayar; dokunma alanı (::before) simgenin üstünde kalır */
.node.edge-r{transform:translate(calc(-100% + 26px),26px)} .node.edge-r::before{left:calc(100% - 26px)}
.node.edge-l{transform:translate(-26px,26px)} .node.edge-l::before{left:26px}
.node.here{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .node.here .n-cost{color:var(--accent)}
.node.closed{opacity:.7} .node.closed .n-cost{color:var(--bad)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:root[data-style="pixel"] .node .n-name{font-size:var(--fs-xs);letter-spacing:0} :root[data-style="pixel"] .node .n-cost{font-size:var(--fs-xs)}
@media (max-width:400px){.node{padding:var(--sp-0-5) 5px}.node .n-name{font-size:var(--fs-2xs)}}
/* alt sekmeler */
.subtabs{display:flex;gap:var(--sp-1);overflow-x:auto;flex-shrink:0}
.subtabs button{flex:1 0 auto;font-family:var(--mono);font-size:var(--tx-label);text-transform:uppercase;letter-spacing:.05em;padding:var(--sp-2) var(--sp-2-5);background:var(--surface);color:var(--muted);border:1px solid var(--line2);cursor:pointer;white-space:nowrap}
.subtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

# Oyunun web sürümünü gh-pages dalına yazar; GitHub Pages bu daldan yayınlar:
# https://ceomai.github.io/Space_Scrapper/  (Settings → Pages → Deploy from a branch → gh-pages / root)
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sayfayı hazırla
        run: |
          mkdir -p _site
          cp -r web/js _site/
          touch _site/.nojekyll
          node -e "
            const fs = require('fs');
            const body = fs.readFileSync('web/index.html', 'utf8');
            const head = '<!doctype html><html lang=\"tr\"><head><meta charset=\"utf-8\">'
              + '<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">'
              + '<meta name=\"theme-color\" content=\"#0c0a1d\"></head><body>';
            fs.writeFileSync('_site/index.html', head + body + '</body></html>');
          "

      - name: gh-pages dalına yaz
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web sürümü: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

# Oyunun web sürümünü GitHub Pages'te yayınlar: https://ceomai.github.io/Space_Scrapper/
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sayfayı hazırla
        run: |
          mkdir -p _site
          cp -r web/js _site/
          node -e "
            const fs = require('fs');
            const body = fs.readFileSync('web/index.html', 'utf8');
            const head = '<!doctype html><html lang=\"tr\"><head><meta charset=\"utf-8\">'
              + '<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">'
              + '<meta name=\"theme-color\" content=\"#0c0a1d\"></head><body>';
            fs.writeFileSync('_site/index.html', head + body + '</body></html>');
          "

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

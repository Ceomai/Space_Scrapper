# Oyunun web sürümünü gh-pages dalına yazar; GitHub Pages bu daldan yayınlar:
# https://ceomai.github.io/Space_Scrapper/  (Settings → Pages → Deploy from a branch → gh-pages / root)
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sayfayı hazırla
        run: |
          mkdir -p _site
          cp -r web/js web/icons web/index.html web/theme.css web/manifest.webmanifest web/privacy.html _site/
          touch _site/.nojekyll
          # Service worker: sürüm adı commit kimliği, önbelleğe alınacak dosyalar yayınlanan dosyaların listesi
          node -e "
            const fs = require('fs');
            const files = ['./', './index.html', './theme.css', './manifest.webmanifest']
              .concat(fs.readdirSync('_site/js').map(f => './js/' + f))
              .concat(fs.readdirSync('_site/icons').filter(f => !f.includes('1024')).map(f => './icons/' + f));
            let sw = fs.readFileSync('web/sw.js', 'utf8')
              .replace('__BUILD__', process.env.GITHUB_SHA.slice(0, 12))
              .replace(/\/\*FILES\*\/[\s\S]*?\/\*FILES\*\//, JSON.stringify(files));
            fs.writeFileSync('_site/sw.js', sw);
          "

      - name: gh-pages dalına yaz
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web sürümü: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

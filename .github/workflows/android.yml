name: Android (Play Store paketi)

# Oyunun web dosyaları (web/) Capacitor ile Android uygulamasına sarılır.
# Sırlar tanımlıysa imzalı .aab (Play Console'a yüklenecek) ve .apk (telefona doğrudan kurulum) üretilir
# ve "android" adlı GitHub sürümüne konur. Sırlar yoksa imzasız deneme derlemesi yapılır.
# Gerekli sırlar (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Bağımlılıklar
        run: npm ci
      - name: Web dosyalarını Android projesine kopyala
        run: npx cap sync android
      - name: Yükleme anahtarı
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android imza sırları tanımlı değil; imzasız deneme derlemesi yapılıyor (Play Console'a yüklenemez)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Derle (.aab ve .apk)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          mkdir -p ../out
          cp app/build/outputs/bundle/release/*.aab ../out/space-scrapper-${VERSION_NAME}.aab
          cp app/build/outputs/apk/release/*.apk ../out/space-scrapper-${VERSION_NAME}.apk
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: space-scrapper-android-${{ env.VERSION_NAME }}
          path: out/*
      - name: GitHub sürümünü güncelle
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android (Play Store)" --notes "Play Console'a yüklenecek .aab ve telefona doğrudan kurulabilecek .apk. Her güncellemede yenilenir."
          for f in $(gh release view android --json assets -q '.assets[].name'); do gh release delete-asset android "$f" -y; done
          gh release upload android out/* --clobber
          gh release edit android --notes "Sürüm ${VERSION_NAME} (versionCode ${VERSION_CODE}) · commit ${GITHUB_SHA::7}. Play Console'a .aab dosyasını yükle; .apk telefona doğrudan kurulum içindir."
